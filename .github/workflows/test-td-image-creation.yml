name: Test TD Image Creation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-images:
    strategy:
      matrix:
        image-number: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OFFICIAL_UBUNTU_IMAGE: "https://cloud-images.ubuntu.com/noble/current/"
      CLOUD_IMG: "noble-server-cloudimg-amd64.img"

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Build image ${{ matrix.image-number }}
        run: |
          cd guest-tools/image/
          sudo -E OFFICIAL_UBUNTU_IMAGE="$OFFICIAL_UBUNTU_IMAGE" CLOUD_IMG="$CLOUD_IMG" ./create-td-image.sh
          mv tdx-guest-ubuntu-24.04-generic.qcow2 tdx-guest-ubuntu-24.04-generic-${{ matrix.image-number }}.qcow2
          rm -f *.img *.raw

      - name: Convert and compress image
        run: |
          cd guest-tools/image/
          qemu-img convert -f qcow2 -O raw tdx-guest-ubuntu-24.04-generic-${{ matrix.image-number }}.qcow2 disk-${{ matrix.image-number }}.raw
          tar -czf tdx-guest-ubuntu-24.04-generic-${{ matrix.image-number }}.tar.gz disk-${{ matrix.image-number }}.raw
          rm -f disk-${{ matrix.image-number }}.raw

      - name: Generate file hash
        run: |
          cd guest-tools/image/
          sha256sum tdx-guest-ubuntu-24.04-generic-${{ matrix.image-number }}.tar.gz > tdx-guest-ubuntu-24.04-generic-${{ matrix.image-number }}.sha256

      - name: Upload compressed raw image and hash
        uses: actions/upload-artifact@v4
        with:
          name: td-image-${{ matrix.image-number }}
          path: |
            guest-tools/image/tdx-guest-ubuntu-24.04-generic-${{ matrix.image-number }}.tar.gz
            guest-tools/image/tdx-guest-ubuntu-24.04-generic-${{ matrix.image-number }}.sha256

      - name: Upload uncompressed image for comparison
        uses: actions/upload-artifact@v4
        with:
          name: td-image-${{ matrix.image-number }}-qcow2
          path: guest-tools/image/tdx-guest-ubuntu-24.04-generic-${{ matrix.image-number }}.qcow2

  compare-virt-diff:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install libguestfs-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: td-images

      - name: Compare images using virt-diff
        run: |
          sudo virt-diff --verbose -a tdx-guest-ubuntu-24.04-generic-1.qcow2 -A tdx-guest-ubuntu-24.04-generic-2.qcow2 > image-diff.txt

      - name: Upload virt-diff results
        uses: actions/upload-artifact@v4
        with:
          name: virt-diff-report
          path: virt-diff.txt

  compare-qemu:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Download image 1
        uses: actions/download-artifact@v4
        with:
          name: td-image-1-qcow2

      - name: Download image 2
        uses: actions/download-artifact@v4
        with:
          name: td-image-2-qcow2

      - name: Compare images using qemu-img
        run: sudo qemu-img compare -p -f qcow2 tdx-guest-ubuntu-24.04-generic-1.qcow2 tdx-guest-ubuntu-24.04-generic-2.qcow2 2>&1 > qemu-diff.txt

      - name: Upload qemu-img results
        uses: actions/upload-artifact@v4
        with:
          name: qemu-diff-report
          path: qemu-diff.txt
