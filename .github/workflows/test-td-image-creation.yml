name: Test TD Image Creation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-td-image-creation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OFFICIAL_UBUNTU_IMAGE: "https://cloud-images.ubuntu.com/noble/current/"
      CLOUD_IMG: "noble-server-cloudimg-amd64.img"
      CACHE_KEY: ubuntu-noble-image-${{ hashFiles('guest-tools/image/create-td-image.sh') }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Ubuntu Image
        id: cache-ubuntu-image
        uses: actions/cache@v3
        with:
          path: guest-tools/image/${{ env.CLOUD_IMG }}
          key: ${{ env.CACHE_KEY }}

      - name: Download Ubuntu Image if not cached
        if: steps.cache-ubuntu-image.outputs.cache-hit != 'true'
        run: |
          cd guest-tools/image/
          wget ${{ env.OFFICIAL_UBUNTU_IMAGE }}/${{ env.CLOUD_IMG }}

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Run create-td-image.sh script
        run: |
          cd guest-tools/image/
          sudo -E OFFICIAL_UBUNTU_IMAGE="$OFFICIAL_UBUNTU_IMAGE" CLOUD_IMG="$CLOUD_IMG" ./create-td-image.sh

      - name: Verify image creation
        run: |
          if [ -f guest-tools/image/tdx-guest-ubuntu-24.04-generic.qcow2 ]; then
            echo "TD image created successfully"
          else
            echo "TD image creation failed"
            exit 1
          fi

      - name: Convert image to raw format and compress
        run: |
          cd guest-tools/image/
          qemu-img convert -f qcow2 -O raw tdx-guest-ubuntu-24.04-generic.qcow2 disk.raw
          tar -czvf tdx-guest-ubuntu-24.04-generic.tar.gz disk.raw

      - name: Compress qcow2 image
        run: |
          cd guest-tools/image/
          tar -czvf tdx-guest-ubuntu-24.04-generic.qcow2.tar.gz tdx-guest-ubuntu-24.04-generic.qcow2

      - name: Generate and store file hashes
        run: |
          cd guest-tools/image/
          sha256sum tdx-guest-ubuntu-24.04-generic.tar.gz > tdx-guest-ubuntu-24.04-generic.tar.gz.sha256
          sha256sum tdx-guest-ubuntu-24.04-generic.qcow2.tar.gz > tdx-guest-ubuntu-24.04-generic.qcow2.tar.gz.sha256
          cat *.sha256

      - name: Upload raw TD image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: td-image-raw
          path: |
            guest-tools/image/tdx-guest-ubuntu-24.04-generic.tar.gz
            guest-tools/image/tdx-guest-ubuntu-24.04-generic.tar.gz.sha256

      - name: Upload qcow2 TD image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: td-image-qcow2
          path: |
            guest-tools/image/tdx-guest-ubuntu-24.04-generic.qcow2.tar.gz
            guest-tools/image/tdx-guest-ubuntu-24.04-generic.qcow2.tar.gz.sha256
