name: Test TD Image Creation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-td-image-creation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OFFICIAL_UBUNTU_IMAGE: "https://cloud-images.ubuntu.com/noble/current/"
      CLOUD_IMG: "noble-server-cloudimg-amd64.img"

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils libguestfs-tools

      - name: Build first image
        run: |
          cd guest-tools/image/
          sudo -E OFFICIAL_UBUNTU_IMAGE="$OFFICIAL_UBUNTU_IMAGE" CLOUD_IMG="$CLOUD_IMG" ./create-td-image.sh
          mv tdx-guest-ubuntu-24.04-generic.qcow2 tdx-guest-ubuntu-24.04-generic-1.qcow2

      - name: Build second image
        run: |
          cd guest-tools/image/
          sudo -E OFFICIAL_UBUNTU_IMAGE="$OFFICIAL_UBUNTU_IMAGE" CLOUD_IMG="$CLOUD_IMG" ./create-td-image.sh
          mv tdx-guest-ubuntu-24.04-generic.qcow2 tdx-guest-ubuntu-24.04-generic-2.qcow2

      - name: Compare images using virt-diff
        run: |
          cd guest-tools/image/
          echo "=== Image Comparison Report ===" > image-diff.txt
          echo "Date: $(date)" >> image-diff.txt
          echo "=============================\n" >> image-diff.txt
          sudo virt-diff --format long --human-readable --time-days --dir-links --extra --uids --times -a tdx-guest-ubuntu-24.04-generic-1.qcow2 -A tdx-guest-ubuntu-24.04-generic-2.qcow2 > image-diff.txt
          echo "Differences found:"
          cat image-diff.txt

      - name: Convert and compress images
        run: |
          cd guest-tools/image/
          # Process first image
          qemu-img convert -f qcow2 -O raw tdx-guest-ubuntu-24.04-generic-1.qcow2 disk-1.raw
          tar -czvf tdx-guest-ubuntu-24.04-generic-1.tar.gz disk-1.raw
          tar -czvf tdx-guest-ubuntu-24.04-generic-1.qcow2.tar.gz tdx-guest-ubuntu-24.04-generic-1.qcow2
          # Process second image
          qemu-img convert -f qcow2 -O raw tdx-guest-ubuntu-24.04-generic-2.qcow2 disk-2.raw
          tar -czvf tdx-guest-ubuntu-24.04-generic-2.tar.gz disk-2.raw
          tar -czvf tdx-guest-ubuntu-24.04-generic-2.qcow2.tar.gz tdx-guest-ubuntu-24.04-generic-2.qcow2

      - name: Generate and store file hashes
        run: |
          cd guest-tools/image/
          sha256sum tdx-guest-ubuntu-24.04-generic-*.tar.gz > hashes.sha256
          sha256sum tdx-guest-ubuntu-24.04-generic-*.qcow2.tar.gz >> hashes.sha256
          cat hashes.sha256

      - name: Upload image differences
        uses: actions/upload-artifact@v4
        with:
          name: image-differences
          path: guest-tools/image/image-diff.txt

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: td-images
          path: |
            guest-tools/image/tdx-guest-ubuntu-24.04-generic-*.tar.gz
            guest-tools/image/tdx-guest-ubuntu-24.04-generic-*.qcow2.tar.gz
            guest-tools/image/hashes.sha256
